<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Data Analysis</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">LEAGUE<br>ANALYSIS</div>
    <nav class="side-nav">
      <button class="active" data-view="view-games">Games</button>
      <button data-view="view-teams">Teams</button>
      <button data-view="view-players">Players</button>
      <button data-view="view-details">Champions</button>
    </nav>
  </aside>

  <div class="main-col">

    <div class="controls-bar">
      <div class="controls-inner">
        <div class="filter-cascade">
          <select id="year-select" class="filter-select">
            <option value="">All years</option>
          </select>
          <div class="league-filter" id="league-filter">
            <button type="button" class="league-filter-btn" id="league-filter-btn">
              All Leagues
              <span class="league-filter-caret">▾</span>
            </button>
            <div class="league-filter-panel" id="league-filter-panel"></div>
          </div>
        </div>
      </div>
    </div>

    <main>
    <div class="main-inner">

      <!-- ── Champions ── -->
  <div id="view-details" class="view">
    <div class="section-title">Champion Details</div>
    <div class="stat-tiles" id="champ-stat-tiles"></div>
    <input class="search-bar" id="search" type="text"
      placeholder="Search champion…" />
    <div class="details-layout">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-col="champion">Champion</th>
              <th data-col="total_games">Games</th>
              <th data-col="wins">Wins</th>
              <th data-col="win_rate">Win Rate</th>
              <th data-col="presence">Presence</th>
            </tr>
          </thead>
          <tbody id="champ-tbody"></tbody>
        </table>
      </div>
      <div id="detail-card" class="detail-card">
        <div class="empty">Select a champion</div>
      </div>
    </div>
  </div>

  <!-- ── Players ── -->
  <div id="view-players" class="view">
    <div class="section-title">Players</div>
    <div class="stat-tiles" id="player-stat-tiles"></div>
    <div class="player-filter-bar">
      <input class="search-bar" id="player-search" type="text"
        placeholder="Search player or team…" />
      <div class="role-pills">
        <button class="role-pill" data-role="top"  onclick="setRoleFilter('top')">TOP</button>
        <button class="role-pill" data-role="jng"  onclick="setRoleFilter('jng')">JNG</button>
        <button class="role-pill" data-role="mid"  onclick="setRoleFilter('mid')">MID</button>
        <button class="role-pill" data-role="bot"  onclick="setRoleFilter('bot')">BOT</button>
        <button class="role-pill" data-role="sup"  onclick="setRoleFilter('sup')">SUP</button>
      </div>
    </div>
    <div class="details-layout">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-col-p="playername">Player</th>
              <th data-col-p="position">Role</th>
              <th data-col-p="teamname">Team</th>
              <th data-col-p="games">Games</th>
              <th data-col-p="kda">KDA</th>
              <th data-col-p="dpm">DPM</th>
              <th data-col-p="win_rate">Win Rate</th>
            </tr>
          </thead>
          <tbody id="player-tbody"></tbody>
        </table>
      </div>
      <div id="player-detail-card" class="detail-card">
        <div class="empty">Select a player</div>
      </div>
    </div>
  </div>

  <!-- ── Teams ── -->
  <div id="view-teams" class="view">
    <div class="section-title">Teams</div>
    <div class="stat-tiles" id="team-stat-tiles"></div>
    <input class="search-bar" id="team-search" type="text"
      placeholder="Search team…" />
    <div class="details-layout">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-col-t="teamname">Team</th>
              <th data-col-t="games">Games</th>
              <th data-col-t="win_rate">Win Rate</th>
              <th data-col-t="avg_game_min">Avg Game</th>
            </tr>
          </thead>
          <tbody id="team-tbody"></tbody>
        </table>
      </div>
      <div id="team-detail-card" class="detail-card">
        <div class="empty">Select a team</div>
      </div>
    </div>
  </div>

  <!-- ── Games ── -->
  <div id="view-games" class="view active">
    <div class="section-title">Game Results</div>
    <div class="stat-tiles" id="games-stat-tiles"></div>
    <input class="search-bar" id="game-team-search" type="text"
      placeholder="Filter by team…" />
    <div class="series-list" id="games-list">
      <div class="loading">Loading…</div>
    </div>
      </div>

    </div>
    </main>

  </div>
</div>

<script src="/js/state.js"></script>
<script src="/js/ddragon.js"></script>
<script src="/js/teams.js"></script>
<script src="/js/api.js"></script>
<script src="/js/filters.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/detail-card.js"></script>
<script src="/js/data-table.js"></script>
<script src="/js/champion-table.js"></script>
<script src="/js/player-view.js"></script>
<script src="/js/team-view.js"></script>
<script src="/js/games.js"></script>
<script src="/js/stat-tiles.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
